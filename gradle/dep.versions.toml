[versions]
spring-modulith = "2.1.2"
archunit = "1.4.1"
hdrhistogram = "2.2.2"
siloverse-identifiers = "0.1.0"
mockito-kotlin = "6.4.0"
siloverse-messaging = "1.0.12"

[libraries]
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }
hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
siloverse-identifiers-bom = { module = "io.github.siloverse:identifiers-bom", version.ref = "siloverse-identifiers" }
siloverse-identifiers-core = { module = "io.github.siloverse:identifiers-core" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
micrometer-core = { module = "io.micrometer:micrometer-core" }
siloverse-messaging-core = { module = "io.github.siloverse:messaging-core", version.ref = "siloverse-messaging" }
siloverse-messaging-rabbitmq = { module = "io.github.siloverse:messaging-rabbitmq", version.ref = "siloverse-messaging" }
siloverse-messaging-spring = { module = "io.github.siloverse:messaging-spring", version.ref = "siloverse-messaging" }

[bundles]
siloverse-messaging = [
    "siloverse-messaging-core",
    "siloverse-messaging-rabbitmq",
    "siloverse-messaging-spring"
]