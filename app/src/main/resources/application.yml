server:
  port: 10301
spring:
  application:
    name: brokerage
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcClientAutoConfiguration
management:
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: true
  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: https://otel.macgrant-platform.test/v1/logs
    tracing:
      export:
        otlp:
          endpoint: https://otel.macgrant-platform.test/v1/traces
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,info

brokerage:
  ledger:
    datasource:
      url: jdbc:postgresql://postgres.macgrant-platform.test:5432/brokerage
      username: ledger
      password: ledger

messaging:
  rabbitmq:
    host: rabbitmq.macgrant-platform.test
    port: 5672
    username: admin
    password: admin
    vhost: siloverse